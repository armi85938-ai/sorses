<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e17">
<title>ARMIN TRADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Goldman:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b14;--panel:#0a101c;--panel-2:#111a2c;--panel-3:#1a2740;
  --border:#1c2a44;--border-light:#2a3d5c;
  --text:#eef2f8;--text-dim:#8fa0b8;--text-dimmer:#5a6b82;
  --green:#10b981;--green-bright:#0ecb81;
  --red:#ef4444;--red-bright:#f6465d;
  --accent:#6366f1;--accent-2:#8b5cf6;
  --grad-green:linear-gradient(135deg,#10b981,#0ecb81);
  --grad-red:linear-gradient(135deg,#ef4444,#f6465d);
  --grad-accent:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
  --radius:16px;--radius-sm:12px;
  --font:'Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="light"]{
  --bg:#f3f6fc;--panel:#ffffff;--panel-2:#f8fafd;--panel-3:#eef2f9;
  --border:#dbe3ef;--border-light:#c3cfe2;
  --text:#0a1628;--text-dim:#4a5a72;--text-dimmer:#6b7c94;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 0% 0%,rgba(99,102,241,.1),transparent 50%),radial-gradient(circle at 100% 100%,rgba(236,72,153,.07),transparent 50%)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}

.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(10,16,28,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:100;flex-wrap:wrap}
[data-theme="light"] .topbar{background:rgba(255,255,255,.95)}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:38px;height:38px;color:#fff;padding:7px;background:var(--grad-accent);border-radius:12px}
.brand-en{font-family:'Goldman',var(--font);font-size:22px;font-weight:700;letter-spacing:1.5px;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-family:var(--mono);font-size:8px;color:var(--text-dimmer);letter-spacing:4px}
.price-ticker{display:flex;align-items:center;gap:12px;padding:7px 18px;background:var(--panel-2);border:1px solid var(--border);border-radius:14px}
.ticker-symbol{font-size:12px;font-weight:700;color:var(--text-dim)}
.ticker-price{font-family:var(--mono);font-size:18px;font-weight:700}
.ticker-price.up{color:var(--green-bright)}
.ticker-price.down{color:var(--red-bright)}
.ticker-toman{font-family:var(--mono);font-size:11px;color:var(--text-dimmer)}
.ticker-change{font-family:var(--mono);font-size:12px;font-weight:600}
.ticker-change.up{color:var(--green-bright)}
.ticker-change.down{color:var(--red-bright)}
.header-actions{display:flex;gap:6px;margin-right:auto}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}

.body{display:flex;flex:1;overflow:hidden;min-height:0}
.panel{display:flex;flex-direction:column;background:var(--panel);min-width:0}
.watchlist-panel{width:310px;border-left:1px solid var(--border)}
.trade-panel{width:390px;border-right:1px solid var(--border)}
.panel-header{padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-header h3{font-size:13px;font-weight:700;color:var(--text-dim)}

.watchlist{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:3px}
.watch-item{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:12px;cursor:pointer;transition:all .18s;border:1px solid transparent}
.watch-item:hover{background:var(--panel-2);border-color:var(--border)}
.watch-item.active{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.1));border-color:rgba(99,102,241,.55)}
.wi-left{display:flex;align-items:center;gap:11px}
.wi-icon{width:32px;height:32px;border-radius:10px;background:var(--panel-3);display:flex;align-items:center;justify-content:center;overflow:hidden}
.wi-icon img{width:100%;height:100%;object-fit:contain;padding:5px}
.watch-item.active .wi-icon{background:var(--grad-accent)}
.wi-symbol{font-size:13px;font-weight:700;font-family:var(--mono)}
.wi-name{font-size:10px;color:var(--text-dimmer)}
.wi-right{text-align:left;font-family:var(--mono)}
.wi-price{font-size:12px;font-weight:600;padding:1px 5px;border-radius:5px}
.wi-toman{font-size:10px;color:var(--text-dimmer)}
.wi-change{font-size:10px;font-weight:600}
.wi-change.positive{color:var(--green-bright)}
.wi-change.negative{color:var(--red-bright)}

.chart-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chart-toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;overflow-x:auto}
.timeframes,.indicators,.drawing-tools{display:flex;gap:4px;flex-shrink:0}
.timeframes button,.indicators button,.drawing-tools button,.action-btn{padding:6px 13px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--mono);transition:all .18s;flex-shrink:0}
.indicators button,.drawing-tools button,.action-btn{font-family:var(--font)}
.timeframes button:hover,.indicators button:hover,.drawing-tools button:hover,.action-btn:hover{background:var(--panel-2);color:var(--text)}
.timeframes button.active{background:var(--panel-3);color:var(--text);border-color:var(--accent)}
.indicators button.active{background:rgba(139,92,246,.22);color:var(--accent-2);border-color:var(--accent-2)}
.drawing-tools button.active{background:rgba(16,185,129,.22);color:var(--green-bright);border-color:var(--green-bright)}
.action-btn{background:rgba(99,102,241,.15);color:var(--accent-2);border:1px solid rgba(99,102,241,.4)}
.action-btn.danger{background:rgba(239,68,68,.15);color:var(--red-bright);border-color:rgba(239,68,68,.4)}
.toolbar-divider{width:1px;height:22px;background:var(--border);flex-shrink:0}
.chart-wrapper{position:relative;flex:1;min-height:0;width:100%;height:100%;overflow:hidden}
#chart{position:absolute;inset:0;width:100%!important;height:100%!important}
#drawingSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible}
.chart-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,11,20,.92);backdrop-filter:blur(8px);color:var(--text-dim);font-size:13px;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s;gap:14px}
[data-theme="light"] .chart-overlay{background:rgba(243,246,252,.92)}
.chart-overlay.visible{opacity:1;pointer-events:auto}
.spinner{width:22px;height:22px;border:2px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crosshair-guide{position:absolute;top:0;bottom:0;width:1px;background:rgba(99,102,241,.7);pointer-events:none;z-index:9;display:none}
.crosshair-guide.active{display:block}

body.sltp-mode .chart-wrapper{position:fixed;top:16px;left:16px;right:16px;bottom:16px;z-index:500;border:2px solid var(--accent);border-radius:20px;background:var(--bg);overflow:hidden;box-shadow:0 0 0 9999px rgba(7,11,20,.9),0 0 100px rgba(99,102,241,.5);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
body.sltp-mode .chart-wrapper::before{content:'🎯 نقطه اول = حد ضرر (قرمز)، نقطه دوم = حد سود (سبز)';position:absolute;top:18px;left:50%;transform:translateX(-50%);background:var(--grad-accent);color:#fff;padding:12px 24px;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:700;z-index:600;box-shadow:0 8px 30px rgba(99,102,241,.6);white-space:nowrap;pointer-events:none}
body.sltp-mode .topbar,body.sltp-mode .watchlist-panel,body.sltp-mode .trade-panel,body.sltp-mode .mobile-nav,body.sltp-mode .chart-toolbar{opacity:.1;pointer-events:none;transition:opacity .3s;filter:blur(3px)}
.sltp-cancel-btn{display:none;position:fixed;top:30px;left:30px;z-index:600;background:var(--grad-red);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 25px rgba(239,68,68,.5)}
body.sltp-mode .sltp-cancel-btn{display:block}

.trade-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.balance-card{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(236,72,153,.07));border:1px solid rgba(99,102,241,.3);border-radius:var(--radius);padding:18px}
.balance-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.balance-row:last-child{margin-bottom:0}
.balance-label{font-size:11px;color:var(--text-dim)}
.balance-value{font-family:var(--mono);font-size:17px;font-weight:700}
.balance-value.equity{font-size:19px;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.trade-form{display:flex;flex-direction:column;gap:12px}
.form-label{font-size:11px;color:var(--text-dim);font-weight:600;display:flex;justify-content:space-between}
.leverage-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.leverage-btns button{padding:9px 4px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.leverage-btns button.active{background:rgba(139,92,246,.25);color:var(--accent-2);border-color:var(--accent-2)}
.amount-input-group input,.sl-tp-group input{width:100%;padding:13px 15px;border-radius:var(--radius-sm);background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:16px;font-weight:600;outline:none;transition:all .2s}
.sl-tp-group input{font-size:13px;padding:11px 13px}
.amount-input-group input:focus,.sl-tp-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.quick-amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.quick-amounts button{padding:7px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.sl-tp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl-tp-group{display:flex;flex-direction:column;gap:5px}
.sl-tp-group label{font-size:10px;color:var(--text-dimmer);font-weight:600}
.sltp-status{font-size:10px;color:var(--green-bright);text-align:center;padding:6px;background:rgba(16,185,129,.1);border-radius:6px;display:none}
.sltp-status.active{display:block}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.trade-btn{padding:16px 14px;border:none;border-radius:var(--radius-sm);color:#fff;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s}
.trade-btn:hover{transform:translateY(-3px)}
.trade-btn:active{transform:translateY(0) scale(.97)}
.trade-btn:disabled{opacity:.5;cursor:not-allowed}
.buy-btn{background:var(--grad-green);box-shadow:0 8px 25px rgba(16,185,129,.4)}
.sell-btn{background:var(--grad-red);box-shadow:0 8px 25px rgba(239,68,68,.4)}
.btn-label{font-size:15px;font-weight:800}
.btn-sub{font-size:10px;opacity:.85;letter-spacing:2px}

.section{display:flex;flex-direction:column;gap:9px}
.section-header{display:flex;justify-content:space-between;align-items:center}
.section-header h4{font-size:12px;font-weight:700;color:var(--text-dim)}
.badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;font-family:var(--mono)}
.clear-btn{background:transparent;border:1px solid var(--border);color:var(--text-dimmer);font-size:10px;padding:4px 9px;border-radius:7px;cursor:pointer;font-family:inherit}
.positions-list,.history-list{display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto}
.empty-state{text-align:center;padding:22px 12px;color:var(--text-dimmer);font-size:11px;background:var(--panel-2);border-radius:10px;border:1px dashed var(--border)}

.position{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:12px}
.position.long{border-right:3px solid var(--green-bright)}
.position.short{border-right:3px solid var(--red-bright)}
.pos-header{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pos-type{font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.5px;font-family:var(--mono)}
.pos-type.long{background:rgba(16,185,129,.25);color:var(--green-bright)}
.pos-type.short{background:rgba(239,68,68,.25);color:var(--red-bright)}
.pos-lev{font-size:9px;font-weight:700;color:#f59e0b;font-family:var(--mono);padding:2px 6px;background:rgba(245,158,11,.18);border-radius:5px}
.pos-symbol{font-size:11px;font-weight:700;font-family:var(--mono);flex:1}
.pos-close{width:26px;height:26px;border-radius:7px;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.35);color:var(--red-bright);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pos-details{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-bottom:4px;font-family:var(--mono)}
.pos-triggers{display:flex;gap:5px;font-size:9px;color:var(--text-dimmer);font-family:var(--mono);margin-bottom:7px;flex-wrap:wrap}
.pos-triggers span{background:var(--panel-3);padding:2px 6px;border-radius:4px}
.pos-pnl{font-family:var(--mono);font-size:15px;font-weight:700;text-align:left}
.pos-pnl.positive{color:var(--green-bright)}
.pos-pnl.negative{color:var(--red-bright)}
.pos-pnl-toman{font-size:10px;color:var(--text-dimmer);text-align:left;font-family:var(--mono)}

.history-item{background:var(--panel-2);border-radius:9px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font-size:11px;border:1px solid var(--border)}
.hist-left{display:flex;align-items:center;gap:7px;font-family:var(--mono)}
.hist-type{font-weight:700;font-size:9px;padding:2px 6px;border-radius:4px}
.hist-type.long{background:rgba(16,185,129,.25);color:var(--green-bright)}
.hist-type.short{background:rgba(239,68,68,.25);color:var(--red-bright)}
.hist-reason{font-size:8px;color:var(--text-dimmer);padding:1px 5px;background:var(--panel-3);border-radius:4px;font-family:var(--font)}
.hist-pnl{font-family:var(--mono);font-size:12px;font-weight:700}
.hist-pnl.positive{color:var(--green-bright)}
.hist-pnl.negative{color:var(--red-bright)}

.mobile-nav{display:none;background:rgba(10,16,28,.95);backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:7px 0 max(7px,env(safe-area-inset-bottom));flex-shrink:0}
.mobile-nav button{flex:1;background:transparent;border:none;color:var(--text-dimmer);font-family:inherit;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:10px}
.mobile-nav button span{font-size:10px;font-weight:600}
.mobile-nav button.active{color:var(--accent-2)}

.toast-container{position:fixed;top:85px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:9px;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--panel-3);border:1px solid var(--border-light);padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.6);opacity:0;transform:translateY(-15px) scale(.95);transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:auto;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast-success{border-color:var(--green);background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(16,185,129,.09))}
.toast-error{border-color:var(--red);background:linear-gradient(135deg,rgba(239,68,68,.22),rgba(239,68,68,.09))}
.toast-info{border-color:var(--accent);background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(99,102,241,.09))}

@media (max-width:1024px){
  .body{flex-direction:column;position:relative}
  .watchlist-panel,.trade-panel,.chart-panel{position:absolute;inset:0;width:100%!important;display:none!important;border:none}
  .body[data-tab="chart"] .chart-panel{display:flex!important}
  .body[data-tab="trade"] .trade-panel{display:flex!important}
  .body[data-tab="watch"] .watchlist-panel{display:flex!important}
  .mobile-nav{display:flex}
}
@media (max-width:640px){
  .topbar{padding:9px 13px;gap:11px}
  .brand-en{font-size:17px}
  .price-ticker{padding:6px 11px;gap:9px;flex:1;justify-content:center}
  .ticker-price{font-size:16px}
  .chart-toolbar{padding:7px 9px;gap:9px}
  body.sltp-mode .chart-wrapper{top:8px;left:8px;right:8px;bottom:8px}
  body.sltp-mode .chart-wrapper::before{font-size:11px;padding:8px 14px;white-space:normal;max-width:90%;text-align:center;top:10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 17l5-5 3 3 5-5 5 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="19" cy="5" r="2" fill="currentColor"/>
      </svg>
      <div><div class="brand-en">ARMIN TRADE</div><div class="brand-sub">GLOBAL MARKETS</div></div>
    </div>
    <div class="price-ticker">
      <span class="ticker-symbol" id="tickerSymbol">BTC/USDT</span>
      <span class="ticker-price" id="tickerPrice">--</span>
      <span class="ticker-toman" id="tickerToman">--</span>
      <span class="ticker-change" id="tickerChange">--</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
      <button class="icon-btn" id="soundBtn" title="صدا">🔊</button>
      <button class="icon-btn" id="resetBtn" title="بازنشانی">🔄</button>
    </div>
  </header>

  <div class="body" id="body" data-tab="chart">
    <aside class="panel watchlist-panel">
      <div class="panel-header"><h3>⭐ بازارها</h3></div>
      <div style="padding:9px 14px;border-bottom:1px solid var(--border);">
        <input type="text" id="symbolSearch" placeholder="جستجو..." style="width:100%;padding:9px 13px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;outline:none;">
      </div>
      <div class="watchlist" id="watchlist"></div>
    </aside>

    <main class="chart-panel">
      <div class="chart-toolbar">
        <div class="timeframes" id="timeframes">
          <button data-tf="1m" class="active">1m</button>
          <button data-tf="5m">5m</button>
          <button data-tf="15m">15m</button>
          <button data-tf="1h">1h</button>
          <button data-tf="4h">4h</button>
          <button data-tf="1d">1d</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="indicators" id="indicators">
          <button data-ind="none" class="active">خاموش</button>
          <button data-ind="rsi">RSI</button>
          <button data-ind="macd">MACD</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="drawing-tools" id="drawingTools">
          <button data-tool="none" class="active">🖱️ نشانگر</button>
          <button data-tool="trendline">📈 خط روند</button>
          <button data-tool="rectangle">▭ مستطیل</button>

  }catch(e){}
}

// ============================================================
// INDICATORS
// ============================================================
function computeRSI(candles,period=14){
  const out=[];if(candles.length<period+1)return out;
  let gains=0,losses=0;for(let i=1;i<=period;i++){const d=candles[i].close-candles[i-1].close;if(d>0)gains+=d;else losses-=d;}
  let avgG=gains/period,avgL=losses/period;const calc=()=>100-100/(1+avgG/(avgL||1e-9));
  out.push({time:candles[period].time,value:calc()});
  for(let i=period+1;i<candles.length;i++){const d=candles[i].close-candles[i-1].close;avgG=(avgG*(period-1)+Math.max(d,0))/period;avgL=(avgL*(period-1)+Math.max(-d,0))/period;out.push({time:candles[i].time,value:calc()});}
  return out;
}
function computeEMA(values,period){
  const k=2/(period+1),out=[];if(!values.length)return out;let ema=values[0];out.push(ema);
  for(let i=1;i<values.length;i++){ema=values[i]*k+ema*(1-k);out.push(ema);}return out;
}
function computeMACD(candles){
  const closes=candles.map(c=>c.close);const fast=12,slow=26,sig=9;
  if(closes.length<slow+sig)return{macd:[],signal:[],hist:[]};
  const ef=computeEMA(closes,fast),es=computeEMA(closes,slow);const macdLine=closes.map((_,i)=>ef[i]-es[i]);
  const signalLine=computeEMA(macdLine.slice(slow-1),sig);const macdOut=[],signalOut=[],histOut=[];
  for(let i=slow-1;i<closes.length;i++){const t=candles[i].time,m=macdLine[i];const sIdx=i-(slow-1),s=signalLine[sIdx];macdOut.push({time:t,value:m});if(s!==undefined){signalOut.push({time:t,value:s});histOut.push({time:t,value:m-s,color:m-s>=0?'rgba(16,185,129,.7)':'rgba(239,68,68,.7)'});}}
  return{macd:macdOut,signal:signalOut,hist:histOut};
}
function computeSMA(candles,period){
  const out=[];if(candles.length<period)return out;let sum=0;
  for(let i=0;i<candles.length;i++){sum+=candles[i].close;if(i>=period)sum-=candles[i-period].close;if(i>=period-1)out.push({time:candles[i].time,value:sum/period});}
  return out;
}

function chartColors(){const dark=state.theme==='dark';return{bg:dark?'#070b14':'#f3f6fc',text:dark?'#8fa0b8':'#4a5a72',grid:dark?'rgba(28,42,68,.6)':'rgba(195,207,226,.6)',border:dark?'#1c2a44':'#dbe3ef'};}

function setDrawingTool(tool){
  if(slTpMode) exitSLTPMode();
  activeDrawingTool=(tool==='none'||!tool)?null:tool;
  drawingStartPoint=null;drawingPreviewPos=null;
  document.querySelectorAll('#drawingTools button').forEach(b=>b.classList.toggle('active',b.dataset.tool===(tool||'none')));
  // Disable chart pan/zoom when drawing
  if(chart){
    chart.applyOptions({handleScroll:!activeDrawingTool, handleScale:!activeDrawingTool});
  }
  redrawSVG();
}

function handleChartClick(param){
  if(!param||!param.point)return;
  const price=candleSeries.coordinateToPrice(param.point.y);
  if(price===null||price<=0)return;

  if(slTpMode){ handleSLTPClick(price); return; }
  if(!activeDrawingTool)return;

  if(activeDrawingTool==='horizontal'){
    const handle=candleSeries.createPriceLine({price,color:'#f59e0b',lineWidth:2,lineStyle:2,axisLabelVisible:true,title:'─'});
    savedDrawings.push({type:'horizontal',price,handle});
    toast('خط افقی رسم شد ✓','success');
    return;
  }

  if(!param.time)return;

  if(!drawingStartPoint){
    drawingStartPoint={time:param.time,price};
    toast('نقطه اول ثبت شد. نقطه دوم را کلیک کنید.','info');
    redrawSVG();
  }else{
    savedDrawings.push({
      type:activeDrawingTool,
      time1:drawingStartPoint.time,price1:drawingStartPoint.price,
      time2:param.time,price2:price,
    });
    drawingStartPoint=null;drawingPreviewPos=null;
    redrawSVG();
    toast('شکل رسم شد ✓','success');
  }
}

function handleChartCrosshairMove(param){
  if(!activeDrawingTool||!drawingStartPoint)return;
  if(!param||!param.point)return;
  drawingPreviewPos={x:param.point.x,y:param.point.y};
  redrawSVG();
}

function redrawSVG(){
  const svg=$('drawingSvg');
  if(!svg)return;
  const wrapper=$('chartWrapper');
  if(!wrapper)return;
  const rect=wrapper.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
  svg.innerHTML='';

  for(const d of savedDrawings){
    if(d.type==='trendline'){
      const x1=chart.timeScale().timeToCoordinate(d.time1);
      const y1=candleSeries.priceToCoordinate(d.price1);
      const x2=chart.timeScale().timeToCoordinate(d.time2);
      const y2=candleSeries.priceToCoordinate(d.price2);
      if(x1===null||y1===null||x2===null||y2===null)continue;
      addSVGLine(svg,x1,y1,x2,y2,'#f59e0b',2);
    }else if(d.type==='rectangle'){
      const x1=chart.timeScale().timeToCoordinate(d.time1);
      const y1=candleSeries.priceToCoordinate(d.price1);
      const x2=chart.timeScale().timeToCoordinate(d.time2);
      const y2=candleSeries.priceToCoordinate(d.price2);
      if(x1===null||y1===null||x2===null||y2===null)continue;
      addSVGRect(svg,Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1),'rgba(245,158,11,.15)','#f59e0b',false);
    }
  }

  if(drawingStartPoint&&drawingPreviewPos){
    const x1=chart.timeScale().timeToCoordinate(drawingStartPoint.time);
    const y1=candleSeries.priceToCoordinate(drawingStartPoint.price);
    if(x1!==null&&y1!==null){
      if(activeDrawingTool==='trendline'){
        addSVGLine(svg,x1,y1,drawingPreviewPos.x,drawingPreviewPos.y,'rgba(245,158,11,.7)',2,'5,5');
      }else if(activeDrawingTool==='rectangle'){
        addSVGRect(svg,Math.min(x1,drawingPreviewPos.x),Math.min(y1,drawingPreviewPos.y),Math.abs(drawingPreviewPos.x-x1),Math.abs(drawingPreviewPos.y-y1),'rgba(245,158,11,.1)','rgba(245,158,11,.7)',true);
      }
    }
  }
}

function addSVGLine(svg,x1,y1,x2,y2,stroke,width,dashArray){
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);
  line.setAttribute('stroke',stroke);line.setAttribute('stroke-width',width);
  if(dashArray)line.setAttribute('stroke-dasharray',dashArray);
  svg.appendChild(line);
}
function addSVGRect(svg,x,y,w,h,fill,stroke,dashed){
  const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x);rect.setAttribute('y',y);rect.setAttribute('width',w);rect.setAttribute('height',h);
  rect.setAttribute('fill',fill);rect.setAttribute('stroke',stroke);rect.setAttribute('stroke-width',2);
  if(dashed)rect.setAttribute('stroke-dasharray','5,5');
  svg.appendChild(rect);
}
function clearAllDrawings(){
  for(const d of savedDrawings){ if(d.type==='horizontal'&&d.handle){ try{candleSeries.removePriceLine(d.handle);}catch(e){} } }
  savedDrawings=[];drawingStartPoint=null;drawingPreviewPos=null;redrawSVG();
  toast('همه رسم‌ها پاک شدند','info');
}

function startDemoMode(){
  if(state.demoMode)return;

  console.log('🟡 Demo mode active — 1-second updates');
  toast('حالت آزمایشی فعال شد — نمودار هر ۱ ثانیه حرکت می‌کند','info');

  state.allSymbols = DEFAULT_LAYOUT.filter(d=>d.pair).map(d=>d.pair);

  const basePrice = DEMO_BASE_PRICES[state.symbol] || 100;
  const candles = generateDemoCandles(basePrice, 300);
  setChartData(candles);
  $('chartOverlay').classList.remove('visible');

  Object.keys(DEMO_BASE_PRICES).forEach(sym=>{
    state.prices[sym] = {price:DEMO_BASE_PRICES[sym], change:(Math.random()-0.5)*5};
  });
  const p = state.prices[state.symbol];
  if(p) updateHeaderPrice(p.price, p.change);
  renderWatchlist();

  if(demoTimer) clearInterval(demoTimer);
  demoTimer = setInterval(demoTick, DEMO_TICK_MS);

function generateDemoCandles(basePrice, count){
  const candles=[];
  const now = Math.floor(Date.now()/1000);
  const intervalSec = intervalToSeconds(state.interval);
  let price = basePrice;
  for(let i=count-1; i>=0; i--){
    const time = Math.floor((now - i*intervalSec)/intervalSec)*intervalSec;
    const open = price;
    const change = (Math.random()-0.5)*price*0.02;
    const close = Math.max(0.0001, open + change);
    const high = Math.max(open,close) * (1+Math.random()*0.01);
    const low = Math.min(open,close) * (1-Math.random()*0.01);
    const volume = Math.random()*1000;
    candles.push({time, open, high, low, close, volume});
    price = close;
  }
  return candles;
}

function intervalToSeconds(tf){
  const map = {'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400};
  return map[tf] || 60;
}

// 1-second tick: update current candle, only create new one when interval boundary crossed
function demoTick(){
  if(!state.demoMode) return;
  const basePrice = DEMO_BASE_PRICES[state.symbol] || state.candles[state.candles.length-1]?.close || 100;
  const currentPrice = state.prices[state.symbol]?.price || basePrice;

  // Small random walk (0.3% per second)
  const change = (Math.random() - 0.5) * basePrice * 0.006;
  const newPrice = Math.max(0.0001, currentPrice + change);

  const intervalSec = intervalToSeconds(state.interval);
  const now = Math.floor(Date.now() / 1000);
  const candleTime = Math.floor(now / intervalSec) * intervalSec;

  const lastCandle = state.candles[state.candles.length - 1];
  let candle;

  if(lastCandle && lastCandle.time === candleTime){
    // Update current candle
    candle = {
      time: candleTime,
      open: lastCandle.open,
      high: Math.max(lastCandle.high, newPrice),
      low: Math.min(lastCandle.low, newPrice),
      close: newPrice,
      volume: lastCandle.volume + Math.random() * 20,
    };
    state.candles[state.candles.length - 1] = candle;
  } else {
    // New candle for the new interval
    candle = {
      time: candleTime,
      open: currentPrice,
      high: Math.max(currentPrice, newPrice),
      low: Math.min(currentPrice, newPrice),
      close: newPrice,
      volume: Math.random() * 100,
    };
    state.candles.push(candle);
    if(state.candles.length > 500) state.candles.shift();
  }

  state.prices[state.symbol] = {
    price: newPrice,
    change: ((newPrice - basePrice) / basePrice) * 100,
  };

  candleSeries.update(candle);
  volumeSeries.update({
    time: candle.time,
    value: candle.volume,
    color: candle.close >= candle.open ? 'rgba(16,185,129,.45)' : 'rgba(239,68,68,.45)',
  });

  if(state.indicator === 'rsi' && rsiSeries){
    rsiSeries.setData(computeRSI(state.candles));
  } else if(state.indicator === 'macd' && macdSeries){
    const m = computeMACD(state.candles);
    macdSeries.setData(m.macd);
    macdSignalSeries.setData(m.signal);
    macdHistSeries.setData(m.hist);
  }

  updateHeaderPrice(newPrice, state.prices[state.symbol].change);
  checkTriggers(state.symbol, newPrice);

  // Update other symbol prices too
  Object.keys(DEMO_BASE_PRICES).forEach(sym => {
    if(sym === state.symbol) return;
    const old = state.prices[sym]?.price || DEMO_BASE_PRICES[sym];
    const ch = (Math.random() - 0.5) * old * 0.003;
    state.prices[sym] = { price: old + ch, change: (ch / DEMO_BASE_PRICES[sym]) * 100 };
    updateWatchUI(sym, old + ch, (ch / DEMO_BASE_PRICES[sym]) * 100);
  });

  maybeRefreshPnl();
  redrawSVG();
}

async function fetchInitialPrices(){
  try{
    const res=await fetch(`https://api.binance.com/api/v3/ticker/price`,{signal:AbortSignal.timeout(5000)});
    if(!res.ok)throw new Error();
    const data=await res.json();
    for(const t of data){if(t.symbol.endsWith('USDT')){state.prices[t.symbol]={price:parseFloat(t.price),change:0};}}
    Object.keys(state.prices).forEach(sym=>{const p=state.prices[sym];updateWatchUI(sym,p.price,p.change);});
    if(state.prices[state.symbol])updateHeaderPrice(state.prices[state.symbol].price,state.prices[state.symbol].change);
    return true;
  }catch(e){
    console.warn('Price fetch failed:',e);
    return false;
  }
}

async function loadKlines(symbol,interval){
  if(state.demoMode){
    const base = DEMO_BASE_PRICES[symbol] || 100;
    const candles = generateDemoCandles(base,300);
    setChartData(candles);
    $('chartOverlay').classList.remove('visible');
    return;
  }

  if(fetchController)fetchController.abort();
  fetchController=new AbortController();
  $('chartOverlay').classList.add('visible');
  try{
    const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=300`;
    const res=await fetch(url,{signal:fetchController.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(state.symbol!==symbol||state.interval!==interval)return;
    const candles=data.map(k=>({time:k[0]/1000,open:parseFloat(k[1]),high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4]),volume:parseFloat(k[5])||0}));
    setChartData(candles);
    if(candles.length){const last=candles[candles.length-1];updateHeaderPrice(last.close);}
  }catch(e){
    if(e.name==='AbortError')return;
    console.error('Kline fetch failed:',e);
    toast('اتصال به بایننس برقرار نشد — حالت آزمایشی فعال می‌شود','error');
    startDemoMode();
  }finally{
    if(!state.demoMode) $('chartOverlay').classList.remove('visible');
  }
}

function connectKlineWs(symbol,interval){
  if(state.demoMode)return;
  if(klineWs){klineWs.onclose=null;klineWs.close();klineWs=null;}
  try{
    const stream=`${symbol.toLowerCase()}@kline_${interval}`;
    klineWs=new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);
    klineWs.onmessage=ev=>{
      try{
        const m=JSON.parse(ev.data);if(!m.k)return;
        const k=m.k;
        const candle={time:k.t/1000,open:parseFloat(k.o),high:parseFloat(k.h),low:parseFloat(k.l),close:parseFloat(k.c),volume:parseFloat(k.v)||0};
        updateChartCandle(candle);updateHeaderPrice(candle.close);checkTriggers(symbol,candle.close);
      }catch(e){}
    };
    klineWs.onerror=()=>{ if(!state.demoMode) startDemoMode(); };
    klineWs.onclose=()=>{ if(state.symbol===symbol&&state.interval===interval&&!state.demoMode) setTimeout(()=>connectKlineWs(symbol,interval),3000); };
  }catch(e){ if(!state.demoMode) startDemoMode(); }
}

function connectTickerWs(){
  if(state.demoMode)return;
  if(tickerWs){tickerWs.onclose=null;tickerWs.close();}
  try{
    tickerWs=new WebSocket(`wss://stream.binance.com:9443/ws/!miniTicker@arr`);
    tickerWs.onmessage=ev=>{
      try{
        const arr=JSON.parse(ev.data);if(!Array.isArray(arr))return;
        for(const t of arr){
          const sym=t.s;const price=parseFloat(t.c);const open=parseFloat(t.o);const change=open?((price-open)/open)*100:0;
          state.prices[sym]={price,change};
          updateWatchUI(sym,price,change);
          if(sym===state.symbol)updateHeaderPrice(price,change);
          checkTriggers(sym,price);
        }
        maybeRefreshPnl();
      }catch(e){}
    };
    tickerWs.onerror=()=>{ if(!state.demoMode) startDemoMode(); };
    tickerWs.onclose=()=>{ if(!state.demoMode) setTimeout(connectTickerWs,3000); };
  }catch(e){ if(!state.demoMode) startDemoMode(); }
}

// ============================================================
// TRADING
// ============================================================
function calcPnlUsdt(pos){
  const p=state.prices[pos.symbol]?.price;if(!p)return 0;
  return pos.type==='long'?(p-pos.entry)*pos.qty:(pos.entry-p)*pos.qty;
}
function calcPnlToman(pos){return calcPnlUsdt(pos)*state.tomanRate;}
function calcLiq(pos){return pos.type==='long'?pos.entry*(1-1/pos.lev):pos.entry*(1+1/pos.lev);}

function openPosition(type){
  const amountToman=parseFloat($('amountInput').value);
  if(!amountToman||amountToman<=0){toast('مقدار معتبر نیست','error');return;}
  if(amountToman>state.balanceToman){toast('موجودی کیف پول کافی نیست','error');return;}
  const price=state.prices[state.symbol]?.price;
  if(!price){toast('قیمت لحظه‌ای در دسترس نیست، صبر کنید...','error');return;}

  let sl=null,tp=null;

  if(slTpLevels.length===2){
    const sorted=[...slTpLevels].sort((a,b)=>a-b);
    if(type==='long'){sl=sorted[0];tp=sorted[1];}
    else{sl=sorted[1];tp=sorted[0];}
  }else{
    const slStr=$('slInput').value.trim(),tpStr=$('tpInput').value.trim();
    sl=slStr?parseFloat(slStr):null;tp=tpStr?parseFloat(tpStr):null;
    if(sl!==null){
      if(isNaN(sl)||sl<=0){toast('حد ضرر نامعتبر','error');return;}
      if(type==='long'&&sl>=price){toast(`برای خرید، حد ضرر باید کمتر از قیمت فعلی (${fmtSmall(price)}) باشد`,'error');return;}
      if(type==='short'&&sl<=price){toast(`برای فروش، حد ضرر باید بیشتر از قیمت فعلی (${fmtSmall(price)}) باشد`,'error');return;}
    }
    if(tp!==null){
      if(isNaN(tp)||tp<=0){toast('حد سود نامعتبر','error');return;}
      if(type==='long'&&tp<=price){toast(`برای خرید، حد سود باید بیشتر از قیمت فعلی (${fmtSmall(price)}) باشد`,'error');return;}
      if(type==='short'&&tp>=price){toast(`برای فروش، حد سود باید کمتر از قیمت فعلی (${fmtSmall(price)}) باشد`,'error');return;}
    }
  }

  const lev=state.leverage;
  const marginUsdt=amountToman/state.tomanRate;
  const qty=(marginUsdt*lev)/price;

  // دقیقاً مبلغ وارد شده از کیف پول کسر می‌شود
  state.balanceToman-=amountToman;

  state.positions.unshift({id:state.posIdCounter++,symbol:state.symbol,type,entry:price,marginToman:amountToman,sizeUsdt:marginUsdt,qty,lev,sl,tp,time:Date.now()});
  clearSLTPLevels();
  $('slInput').value='';$('tpInput').value='';

  const base=state.symbol.slice(0,-4);
  const persianName=PERSIAN_NAMES[base]||base;
  beep(type==='long'?880:520,120);

  let msg=`${type==='long'?'🟢 خرید':'🔴 فروش'} ${fmtToman(amountToman)} ${persianName} (${lev}x)`;
  if(sl)msg+=` | SL: ${fmtSmall(sl)}`;
  if(tp)msg+=` | TP: ${fmtSmall(tp)}`;
  toast(msg,'success');

  saveState();renderAll();
}

function closePosition(id,overridePrice,reason='manual'){
  const idx=state.positions.findIndex(p=>p.id===id);if(idx<0)return;
  const pos=state.positions[idx];
  const price=overridePrice??state.prices[pos.symbol]?.price;
  if(!price){if(reason==='manual')toast('قیمت در دسترس نیست','error');return;}

  const rawPnlUsdt=pos.type==='long'?(price-pos.entry)*pos.qty:(pos.entry-price)*pos.qty;
  const rawPnlToman=rawPnlUsdt*state.tomanRate;
  const totalUsdt=Math.max(0,pos.sizeUsdt+rawPnlUsdt);
  const totalToman=totalUsdt*state.tomanRate;
  const realizedPnlToman=totalToman-pos.marginToman;

  // مبلغ نهایی به کیف پول اضافه می‌شود
  state.balanceToman+=totalToman;

  state.positions.splice(idx,1);
  state.history.unshift({...pos,exit:price,exitTime:Date.now(),pnlToman:realizedPnlToman,pnlUsdt:rawPnlUsdt,totalToman,reason});
  if(state.history.length>100)state.history.length=100;

  const base=pos.symbol.slice(0,-4);
  const persianName=PERSIAN_NAMES[base]||base;
  const sign=realizedPnlToman>=0?'+':'';

  if(reason==='liquidated'){beep(200,400);toast(`⚠️ ${persianName}: لیکویید شد! زیان: ${sign}${fmtToman(realizedPnlToman)}`,'error');}
  else if(reason==='sl'){beep(400,250);toast(`🛑 ${persianName}: حد ضرر فعال شد. نتیجه: ${sign}${fmtToman(realizedPnlToman)}`,'error');}
  else if(reason==='tp'){beep(1400,200);toast(`🎯 ${persianName}: حد سود فعال شد! سود: ${sign}${fmtToman(realizedPnlToman)}`,'success');}
  else{beep(realizedPnlToman>=0?1200:300,150);toast(`📊 ${persianName}: ${realizedPnlToman>=0?'سود':'ضرر'} شما: ${sign}${fmtToman(realizedPnlToman)}`,realizedPnlToman>=0?'success':'error');}

  saveState();renderAll();
}

function checkTriggers(symbol,price){
  const toClose=[];
  for(const pos of state.positions){
    if(pos.symbol!==symbol)continue;
    const rawPnlUsdt=pos.type==='long'?(price-pos.entry)*pos.qty:(pos.entry-price)*pos.qty;
    if(rawPnlUsdt<=-pos.sizeUsdt){toClose.push({id:pos.id,price:calcLiq(pos),reason:'liquidated'});continue;}
    if(pos.sl){
      if(pos.type==='long'&&price<=pos.sl){toClose.push({id:pos.id,price:pos.sl,reason:'sl'});continue;}
      if(pos.type==='short'&&price>=pos.sl){toClose.push({id:pos.id,price:pos.sl,reason:'sl'});continue;}
    }
    if(pos.tp){
      if(pos.type==='long'&&price>=pos.tp){toClose.push({id:pos.id,price:pos.tp,reason:'tp'});continue;}
      if(pos.type==='short'&&price<=pos.tp){toClose.push({id:pos.id,price:pos.tp,reason:'tp'});continue;}
    }
  }
  toClose.forEach(t=>closePosition(t.id,t.price,t.reason));
}

function clearHistory(){
  if(!state.history.length){toast('تاریخچه خالی است','info');return;}
  if(confirm('تاریخچه معاملات پاک شود؟')){state.history=[];saveState();renderAll();toast('تاریخچه پاک شد','info');}
}

// ============================================================
// RENDER
// ============================================================
function renderBalance(){
  $('balanceToman').textContent=fmtToman(state.balanceToman);
  let eqToman=state.balanceToman;
  for(const pos of state.positions)eqToman+=pos.marginToman+calcPnlToman(pos);
  $('equityToman').textContent=fmtToman(eqToman);
  $('equityUsdt').textContent='$'+fmtNum(eqToman/state.tomanRate)+' USDT';
}
function renderPositions(){
  const el=$('positionsList');$('positionsCount').textContent=state.positions.length;
  if(!state.positions.length){el.innerHTML='<div class="empty-state">هیچ پوزیشن بازی وجود ندارد</div>';return;}
  el.innerHTML=state.positions.map(pos=>{
    const base=pos.symbol.slice(0,-4);const persianName=PERSIAN_NAMES[base]||base;
    const pnlToman=calcPnlToman(pos);const pnlClass=pnlToman>=0?'positive':'negative';const liq=calcLiq(pos);
    const triggers=[];if(pos.sl)triggers.push(`<span>SL: ${fmtSmall(pos.sl)}</span>`);if(pos.tp)triggers.push(`<span>TP: ${fmtSmall(pos.tp)}</span>`);if(pos.lev>1)triggers.push(`<span>Liq: ${fmtSmall(liq)}</span>`);
    return `
      <div class="position ${pos.type}" data-pos-id="${pos.id}">
        <div class="pos-header">
          <span class="pos-type ${pos.type}">${pos.type==='long'?'LONG':'SHORT'}</span>
          ${pos.lev>1?`<span class="pos-lev">${pos.lev}x</span>`:''}
          <span class="pos-symbol">${persianName} (${base})</span>
          <button class="pos-close" data-close-id="${pos.id}">×</button>
        </div>
        <div class="pos-details"><span>ورود: ${fmtSmall(pos.entry)}</span><span>مارجین: ${fmtToman(pos.marginToman)}</span></div>
        ${triggers.length?`<div class="pos-triggers">${triggers.join('')}</div>`:''}
        <div class="pos-pnl ${pnlClass}">${pnlToman>=0?'+':''}${fmtToman(pnlToman)}</div>
        <div class="pos-pnl-toman">${pnlToman>=0?'+':''}${(pnlToman/state.tomanRate).toFixed(2)} USDT</div>
      </div>`;
  }).join('');
  el.querySelectorAll('.pos-close').forEach(btn=>btn.addEventListener('click',()=>closePosition(+btn.dataset.closeId)));
}
function renderHistory(){
  const el=$('historyList');
  if(!state.history.length){el.innerHTML='<div class="empty-state">تاریخچه‌ای وجود ندارد</div>';return;}
  const reasonLabels={manual:'دستی',sl:'حد ضرر',tp:'حد سود',liquidated:'لیکویید'};
  el.innerHTML=state.history.slice(0,30).map(h=>{
    const base=h.symbol.slice(0,-4);const persianName=PERSIAN_NAMES[base]||base;const pnlClass=h.pnlToman>=0?'positive':'negative';
    return `
      <div class="history-item">
        <div class="hist-left">
          <span class="hist-type ${h.type}">${h.type==='long'?'L':'S'}</span>
          <span>${persianName} (${base})</span>
          ${h.reason&&h.reason!=='manual'?`<span class="hist-reason">${reasonLabels[h.reason]||''}</span>`:''}
        </div>
        <span class="hist-pnl ${pnlClass}">${h.pnlToman>=0?'+':''}${fmtToman(h.pnlToman)}</span>
      </div>`;
  }).join('');
}
function renderAll(){renderBalance();renderPositions();renderHistory();}

function maybeRefreshPnl(){
  const now=Date.now();if(now-lastTickTime<400)return;lastTickTime=now;
  if(state.positions.length){
    state.positions.forEach(pos=>{
      const el=document.querySelector(`[data-pos-id="${pos.id}"] .pos-pnl`);if(!el)return;
      const pnlToman=calcPnlToman(pos);el.textContent=(pnlToman>=0?'+':'')+fmtToman(pnlToman);el.className='pos-pnl '+(pnlToman>=0?'positive':'negative');
      const elT=document.querySelector(`[data-pos-id="${pos.id}"] .pos-pnl-toman`);if(elT)elT.textContent=(pnlToman>=0?'+':'')+(pnlToman/state.tomanRate).toFixed(2)+' USDT';
    });
  }
  renderBalance();
}

// ============================================================
// MOBILE NAV
// ============================================================
function switchTab(tab){
  $('body').dataset.tab=tab;
  document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(tab==='chart'&&chart){setTimeout(()=>{const r=$('chart').getBoundingClientRect();if(r.width>0&&r.height>0)chart.applyOptions({width:r.width,height:r.height});redrawSVG();},60);}
}

// ============================================================
// EVENTS
// ============================================================
function bindEvents(){
  document.querySelectorAll('#timeframes button').forEach(b=>b.addEventListener('click',()=>selectInterval(b.dataset.tf)));
  document.querySelectorAll('#indicators button').forEach(b=>b.addEventListener('click',()=>setIndicator(b.dataset.ind)));
  document.querySelectorAll('#drawingTools button').forEach(b=>b.addEventListener('click',()=>setDrawingTool(b.dataset.tool)));

  $('sltpBtn').addEventListener('click',()=>{ if(slTpMode)exitSLTPMode();else enterSLTPMode(); });
  $('sltpCancelBtn').addEventListener('click',exitSLTPMode);
  $('clearDrawingsBtn').addEventListener('click',()=>{clearAllDrawings();clearSLTPLevels();});

  document.querySelectorAll('#leverageBtns button').forEach(b=>b.addEventListener('click',()=>{
    state.leverage=+b.dataset.lev;
    document.querySelectorAll('#leverageBtns button').forEach(x=>x.classList.toggle('active',x===b));
    saveState();
  }));
  document.querySelectorAll('.quick-amounts button').forEach(b=>b.addEventListener('click',()=>{
    const pct=parseFloat(b.dataset.pct);
    const v=Math.floor(state.balanceToman*pct);
    $('amountInput').value=Math.max(1000,v);
  }));
  $('buyBtn').addEventListener('click',()=>openPosition('long'));
  $('sellBtn').addEventListener('click',()=>openPosition('short'));
  $('clearHistoryBtn').addEventListener('click',clearHistory);
  $('symbolSearch').addEventListener('input',(e)=>{searchQuery=e.target.value.trim();renderWatchlist();});

  const sb=$('soundBtn');
  function syncSound(){sb.textContent=state.sound?'🔊':'🔇';sb.classList.toggle('active',state.sound);}
  sb.addEventListener('click',()=>{state.sound=!state.sound;saveState();syncSound();toast(state.sound?'صدا روشن':'صدا خاموش','info');});
  syncSound();

  $('themeBtn').addEventListener('click',()=>applyTheme(state.theme==='dark'?'light':'dark'));
  $('resetBtn').addEventListener('click',()=>{if(confirm('همه داده‌ها به حالت اولیه بازگردانده شود؟')){localStorage.removeItem(STORAGE_KEY);location.reload();}});
  document.querySelectorAll('.mobile-nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&slTpMode)exitSLTPMode();});
}

// ============================================================
// INIT
// ============================================================
async function init(){
  loadState();
  applyTheme(state.theme);
  document.querySelectorAll('#timeframes button').forEach(b=>b.classList.toggle('active',b.dataset.tf===state.interval));
  document.querySelectorAll('#leverageBtns button').forEach(b=>b.classList.toggle('active',+b.dataset.lev===state.leverage));

  initChart();
  bindEvents();
  renderAll();
  renderWatchlist();

  fetchTomanRate();

  await fetchAllSymbols();
  const pricesOK = await fetchInitialPrices();

  if(!pricesOK){
    // Binance unreachable → demo mode
    startDemoMode();
  } else {
    connectTickerWs();
    await loadKlines(state.symbol,state.interval);
    setIndicator(state.indicator);
    connectKlineWs(state.symbol,state.interval);
  }

  if(state.candles.length === 0 && !state.demoMode){
    startDemoMode();
  }

  updateActiveSymbol();
  if(state.prices[state.symbol]) updateHeaderPrice(state.prices[state.symbol].price,state.prices[state.symbol].change);

  setInterval(fetchTomanRate,300000);
}

window.addEventListener('beforeunload',()=>{
  if(klineWs)klineWs.close();
  if(tickerWs)tickerWs.close();
  if(demoTimer)clearInterval(demoTimer);
});

init();
})();
</script>
